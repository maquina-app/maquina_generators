# Generated by maquina:oauth. The raw code and its PKCE verifier are
# OauthTestHelper::AUTHORIZATION_CODE and ::CODE_VERIFIER.
mcp_member:
  user: mcp_member
  oauth_client: inspector
  code_digest: <%= Digest::SHA256.hexdigest("mcp-member-authorization-code") %>
  code_challenge: <%= Base64.urlsafe_encode64(Digest::SHA256.digest("mcp-member-code-verifier-0123456789abcdefghijklmn"), padding: false) %>
  redirect_uri: http://localhost:6274/oauth/callback
  scope: read
  resource: http://www.example.com/mcp
  expires_at: <%= 10.minutes.from_now %>
