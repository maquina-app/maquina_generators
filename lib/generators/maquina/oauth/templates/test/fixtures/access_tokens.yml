# Generated by maquina:oauth. Digests only, like the real rows; the raw
# values are the constants in test/test_helpers/oauth_test_helper.rb.
mcp_member_read:
  user: mcp_member
  oauth_client: inspector
  token_digest: <%= Digest::SHA256.hexdigest("mcp-member-read-access-token") %>
  refresh_token_digest: <%= Digest::SHA256.hexdigest("mcp-member-read-refresh-token") %>
  scope: read
  resource: http://www.example.com/mcp
  expires_at: <%= 1.hour.from_now %>

mcp_member_write:
  user: mcp_member
  oauth_client: inspector
  token_digest: <%= Digest::SHA256.hexdigest("mcp-member-write-access-token") %>
  refresh_token_digest: <%= Digest::SHA256.hexdigest("mcp-member-write-refresh-token") %>
  scope: read write
  resource: http://www.example.com/mcp
  expires_at: <%= 1.hour.from_now %>

mcp_admin_read:
  user: mcp_admin
  oauth_client: inspector
  token_digest: <%= Digest::SHA256.hexdigest("mcp-admin-read-access-token") %>
  refresh_token_digest: <%= Digest::SHA256.hexdigest("mcp-admin-read-refresh-token") %>
  scope: read
  resource: http://www.example.com/mcp
  expires_at: <%= 1.hour.from_now %>

# The access part is spent; the refresh token still works.
mcp_member_expired:
  user: mcp_member
  oauth_client: inspector
  token_digest: <%= Digest::SHA256.hexdigest("mcp-member-expired-access-token") %>
  refresh_token_digest: <%= Digest::SHA256.hexdigest("mcp-member-expired-refresh-token") %>
  scope: read
  resource: http://www.example.com/mcp
  expires_at: <%= 1.hour.ago %>

mcp_member_revoked:
  user: mcp_member
  oauth_client: inspector
  token_digest: <%= Digest::SHA256.hexdigest("mcp-member-revoked-access-token") %>
  refresh_token_digest: <%= Digest::SHA256.hexdigest("mcp-member-revoked-refresh-token") %>
  scope: read
  resource: http://www.example.com/mcp
  expires_at: <%= 1.hour.from_now %>
  revoked_at: <%= 1.minute.ago %>
