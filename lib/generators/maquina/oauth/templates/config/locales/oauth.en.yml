en:
  flash:
    connected_applications:
      destroyed: "%{name} can no longer use your account."

  oauth:
    authorizations:
      new:
        title: "Allow %{client_name} to use your account?"
        signed_in_as: "Signed in as %{email}"
        requested: "It's asking to:"
        scopes:
          read: "read: see your data"
          write: "write: make changes for you"
        allow: "Allow"
        cancel: "Cancel"
      error:
        title: "This app can't connect"
        unknown_client: "We couldn't verify this app. Its address doesn't point to a valid app description."
        redirect_mismatch: "This app asked to send you back to an address it hasn't registered."

  connected_applications:
    index:
      title: "Connected apps"
      description: "Apps you've allowed to use your account, such as AI assistants. Revoke one and it loses access right away."
      empty: "No apps are connected to your account."
      scopes:
        read: "Read"
        write: "Write"
      connected: "Connected %{date}"
      last_used: "Last used %{time} ago"
      never_used: "Not used yet"
      revoke: "Revoke"
      revoke_confirm: "Revoke %{name}? It will lose access to your account right away."
